name: Lint Codebase

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Lint Codebase
        id: super-linter
        uses: super-linter/super-linter/slim@9e863354e3ff62e0727d37183162c4a88873df41 # v8.6.0
        env:
          DEFAULT_BRANCH: main
          FILTER_REGEX_EXCLUDE: (dist/.*|CHANGELOG\.md)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          # eslint.config.mjs uses `import.meta.dirname` to anchor tsconfig
          # paths to the repo root, so point super-linter's config lookup at
          # the root instead of the default `.github/linters` directory.
          LINTER_RULES_PATH: .
          ESLINT_USE_FLAT_CONFIG: true
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: false
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
